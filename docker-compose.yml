# Despliegue en Dokploy como servicio "Compose".
# Las variables ${...} se definen en la pestaña Environment del Compose en Dokploy.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://rifan2rd:${POSTGRES_PASSWORD}@db:5432/rifan2rd?schema=public
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET}
      UPLOAD_DIR: /app/uploads
      SITE_NAME: ${SITE_NAME:-Rifan2 RD}
      SITE_URL: ${SITE_URL:?Define SITE_URL}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
      WHATSAPP: ${WHATSAPP:-}
      INSTAGRAM: ${INSTAGRAM:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      PERMIT: ${PERMIT:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rifan2rd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: rifan2rd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifan2rd -d rifan2rd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  pgdata:
